<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWIM BIKE RUN — Triathlonkalender Schweiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #fafafa;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --border: #eaeaea;
      --border-hover: #111111;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 3rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* Header */
    header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 400;
      margin-top: 0.25rem;
    }

    /* Filter & Search Bar */
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .search-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--text-main);
    }

    /* Event Cards */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s, transform 0.1s;
    }

    .event-card:hover {
      border-color: var(--border-hover);
    }

    .event-info h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 0.35rem;
    }

    .event-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .source-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.4rem;
      background: #f0f0f0;
      border-radius: 4px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .event-action a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--text-main);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius);
      transition: all 0.2s;
      white-space: nowrap;
    }

    .event-action a:hover {
      background: var(--text-main);
      color: var(--card-bg);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Mobile Adaptions */
    @media (max-width: 580px) {
      body { padding: 1.5rem 1rem; }
      .event-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .event-action { width: 100%; }
      .event-action a { display: block; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>SWIM BIKE RUN</h1>
      <p class="subtitle">Triathlonkalender Schweiz</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Event oder Ort suchen...">
    </div>

    <main id="eventContainer" class="event-list">
      <div class="empty-state">Events werden geladen...</div>
    </main>
  </div>

  <script>
    let allEvents = [];

    async function fetchEvents() {
      const container = document.getElementById('eventContainer');
      try {
        const res = await fetch('./events.json');
        if (!res.ok) throw new Error('Events konnten nicht geladen werden.');
        
        allEvents = await res.json();
        renderEvents(allEvents);
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Noch keine Events verfügbar oder Fehler beim Laden.</div>';
      }
    }

    function renderEvents(events) {
      const container = document.getElementById('eventContainer');

      if (events.length === 0) {
        container.innerHTML = '<div class="empty-state">Keine passenden Events gefunden.</div>';
        return;
      }

      container.innerHTML = events.map(e => `
        <article class="event-card">
          <div class="event-info">
            <h2>${escapeHtml(e.title)}</h2>
            <div class="event-meta">
              <span>📅 ${escapeHtml(e.date)}</span>
              <span>📍 ${escapeHtml(e.location)}</span>
              ${e.source ? `<span class="source-badge">${escapeHtml(e.source)}</span>` : ''}
            </div>
          </div>
          <div class="event-action">
            <a href="${escapeHtml(e.link)}" target="_blank" rel="noopener noreferrer">Details ↗</a>
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // Suchfilter
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allEvents.filter(event => 
        event.title.toLowerCase().includes(query) || 
        event.location.toLowerCase().includes(query)
      );
      renderEvents(filtered);
    });

    fetchEvents();
  </script>
</body>
</html>
