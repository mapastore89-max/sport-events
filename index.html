<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Events Calendar</title>
  
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1c1c1e;
      --card-hover: #26262a;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f3f4f6;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --tag-bg: #27272a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 2.5rem auto;
    }

    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    p.sub { color: var(--text-muted); font-size: 1.1rem; }

    /* KATEGORIE-TABS / HEADER NAV */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      border-radius: 99px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover, .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* FILTER-BAR */
    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    input, select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 180px;
    }

    /* EVENT LIST VIEW (TRI-NORTHWEST STYLE) */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: center;
      gap: 1.5rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .event-card:hover {
      background: var(--card-hover);
      border-color: #3f3f46;
    }

    /* DATUMS-BOX */
    .date-box {
      background: var(--tag-bg);
      border-radius: 8px;
      padding: 0.5rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .date-box .day { font-size: 1.4rem; font-weight: bold; color: var(--accent); display: block; }
    .date-box .month { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }

    /* DETAILS */
    .event-info h3 { margin: 0 0 0.3rem 0; font-size: 1.25rem; }
    .event-meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tag { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }

    /* ACTION BUTTONS */
    .actions { display: flex; gap: 0.5rem; }

    .btn {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      border: none;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
