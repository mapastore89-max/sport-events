<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Events Calendar</title>
  
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1c1c1e;
      --card-hover: #26262a;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f3f4f6;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --tag-bg: #27272a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 2.5rem auto;
    }

    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    p.sub { color: var(--text-muted); font-size: 1.1rem; }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* KATEGORIE-TABS */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      border-radius: 99px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover, .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* FILTER-BAR */
    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    input, select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 180px;
    }

    /* MONATS-GRUPPEN (ACCORDION) */
    .month-group {
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-bg);
    }

    .month-header {
      padding: 1rem 1.5rem;
      background: #18181a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .month-header:hover {
      background: #222226;
    }

    .month-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .month-count {
      font-size: 0.85rem;
      background: var(--tag-bg);
      color: var(--text-muted);
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
    }

    .toggle-icon {
      font-size: 1.2rem;
      color: var(--accent);
      transition: transform 0.3s ease;
    }

    .month-group.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }

    .month-events {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .month-group.collapsed .month-events {
      display: none;
    }

    /* EVENT CARD */
    .event-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 120px 1fr auto;
      align-items: center;
      gap: 1.5rem;
      transition: border-color 0.2s;
    }

    .event-card:hover {
      border-color: #3f3f46;
    }

    .date-box {
      background: var(--tag-bg);
      border-radius: 8px;
      padding: 0.5rem;
      text-align: center;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .date-box .day { font-size: 1.4rem; font-weight: bold; color: var(--accent); display: block; }
    .date-box .month { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    
    .date-box .countdown {
      margin-top: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--accent);
    }

    .date-box .countdown.past { color: var(--text-muted); }

    .event-info h3 { margin: 0 0 0.3rem 0; font-size: 1.25rem; }
    .event-meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tag { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }

    .actions { display: flex; gap: 0.5rem; }

    .btn {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      border: none;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--tag-bg); }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 1rem;
    }

    .modal {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      max-width: 600px; width: 100%; padding: 2rem; position: relative;
    }

    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    @media (max-width: 768px) {
      .event-card { grid-template-columns: 1fr; gap: 1rem; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Rennkalender 2026</h1>
    <p class="sub">Finde deine nächsten Events & Wettkämpfe</p>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCategory('all', this)">Alle Events</button>
      <button class="tab-btn" onclick="filterCategory('Triathlon', this)">Triathlon</button>
      <button class="tab-btn" onclick="filterCategory('Laufen', this)">Laufen</button>
      <button class="tab-btn" onclick="filterCategory('Rennrad', this)">Rennrad</button>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Nach Event oder Ort suchen..." oninput="applyFilters()">
      <select id="countryFilter" onchange="applyFilters()">
        <option value="all">Alle Länder</option>
        <option value="CH">Schweiz 🇨🇭</option>
        <option value="DE">Deutschland 🇩🇪</option>
        <option value="AT">Österreich 🇦🇹</option>
      </select>
    </div>

    <div id="eventContainer"></div>
  </div>

  <div id="detailModal" class="modal-overlay" onclick="if(event.target === this) closeModal()">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const events = [
      { id: 1, title: 'Spiezathlon', category: 'Triathlon', date: '2026-06-20', location: 'Spiez, Schweiz', country: 'CH', distances: ['Olympic', 'Sprint'], desc: 'Der legendäre Triathlon am Thunersee.', link: 'https://spiezathlon.ch' },
      { id: 2, title: 'Zürich Triathlon', category: 'Triathlon', date: '2026-06-27', location: 'Zürich, Schweiz', country: 'CH', distances: ['5150', 'Sprint'], desc: 'Wettkampf mit Kulisse rund um den Zürichsee.', link: '#' },
      { id: 3, title: 'Challenge Roth', category: 'Triathlon', date: '2026-07-05', location: 'Roth, Deutschland', country: 'DE', distances: ['Langdistanz'], desc: 'Das größte Langdistanz-Rennen der Welt.', link: 'https://www.challenge-roth.com' },
      { id: 4, title: 'City Night Run', category: 'Laufen', date: '2026-05-15', location: 'Frankfurt, Deutschland', country: 'DE', distances: ['5 km', '10 km'], desc: 'Abendlauf durch die Innenstadt.', link: '#' },
      { id: 5, title: 'Berlin Marathon', category: 'Laufen', date: '2026-09-20', location: 'Berlin, Deutschland', country: 'DE', distances: ['42.2 km'], desc: 'Einer der schnellsten Marathons weltweit.', link: '#' },
      { id: 6, title: 'Velothon Challenge', category: 'Rennrad', date: '2026-06-22', location: 'Hamburg, Deutschland', country: 'DE', distances: ['60 km', '100 km'], desc: 'Jedermann-Rennen auf gesperrten Straßen.', link: '#' }
    ];

    let activeCategory = 'all';

    function getCountdownText(eventDateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const eventDate = new Date(eventDateStr);
      eventDate.setHours(0, 0, 0, 0);

      const diffTime = eventDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) return { text: 'Vorüber', isPast: true };
      if (diffDays === 0) return { text: 'Heute!', isPast: false };

      const weeks = Math.floor(diffDays / 7);
      const days = diffDays % 7;

      let parts = [];
      if (weeks > 0) parts.push(`${weeks} Wo.`);
      if (days > 0 || weeks === 0) parts.push(`${days} Tg.`);

      return { text: `In ${parts.join(' ')}`, isPast: false };
    }

    function renderGroupedList(data) {
      const container = document.getElementById('eventContainer');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 2rem;">Keine passenden Events gefunden.</p>';
        return;
      }

      // Sortieren nach Datum
      data.sort((a, b) => new Date(a.date) - new Date(b.date));

      // Events nach Monat gruppieren
      const grouped = {};
      data.forEach(event => {
        const d = new Date(event.date);
        const monthKey = d.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
        if (!grouped[monthKey]) grouped[monthKey] = [];
        grouped[monthKey].push(event);
      });

      // HTML für jeden Monat aufbauen
      Object.keys(grouped).forEach(monthName => {
        const monthEvents = grouped[monthName];

        const monthGroup = document.createElement('div');
        monthGroup.className = 'month-group';

        const monthHeader = document.createElement('div');
        monthHeader.className = 'month-header';
        monthHeader.onclick = () => monthGroup.classList.toggle('collapsed');
        monthHeader.innerHTML = `
          <div class="month-title">
            📅 ${monthName}
            <span class="month-count">${monthEvents.length} Event${monthEvents.length > 1 ? 's' : ''}</span>
          </div>
          <span class="toggle-icon">▼</span>
        `;

        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'month-events';

        monthEvents.forEach(event => {
          const d = new Date(event.date);
          const day = d.getDate().toString().padStart(2, '0');
          const monthShort = d.toLocaleString('de-DE', { month: 'short' }).toUpperCase();
          const countdown = getCountdownText(event.date);

          const card = document.createElement('div');
          card.className = 'event-card';
          card.innerHTML = `
            <div class="date-box">
              <span class="day">${day}</span>
              <span class="month">${monthShort}</span>
              <span class="countdown ${countdown.isPast ? 'past' : ''}">${countdown.text}</span>
            </div>
            <div class="event-info">
              <h3>${event.title}</h3>
              <div class="event-meta">📍 ${event.location}</div>
              <div class="tags">
                <span class="tag">${event.category}</span>
                ${event.distances.map(dist => `<span class="tag" style="background:var(--tag-bg); color:var(--text-muted);">${dist}</span>`).join('')}
              </div>
            </div>
            <div class="actions">
              <button class="btn btn-outline" onclick="openDetails(${event.id})">Details</button>
              ${event.link && event.link !== '#' ? `<a href="${event.link}" target="_blank" class="btn btn-primary">Website</a>` : ''}
            </div>
          `;
          eventsContainer.appendChild(card);
        });

        monthGroup.appendChild(monthHeader);
        monthGroup.appendChild(eventsContainer);
        container.appendChild(monthGroup);
      });
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const country = document.getElementById('countryFilter').value;

      const filtered = events.filter(e => {
        const matchCat = activeCategory === 'all' || e.category === activeCategory;
        const matchSearch = e.title.toLowerCase().includes(search) || e.location.toLowerCase().includes(search);
        const matchCountry = country === 'all' || e.country === country;
        return matchCat && matchSearch && matchCountry;
      });

      renderGroupedList(filtered);
    }

    function openDetails(id) {
      const ev = events.find(e => e.id === id);
      if(!ev) return;

      const countdown = getCountdownText(ev.date);

      document.getElementById('modalContent').innerHTML = `
        <span class="tag">${ev.category}</span>
        <h2 style="margin: 0.5rem 0;">${ev.title}</h2>
        <p style="color:var(--text-muted)">📍 ${ev.location} | 📅 ${ev.date} (${countdown.text})</p>
        <p>${ev.desc}</p>
        <h4>Distanzen:</h4>
        <p>${ev.distances.join(', ')}</p>
        ${ev.link && ev.link !== '#' ? `<a href="${ev.link}" target="_blank" class="btn btn-primary" style="display:inline-block; margin-top:1rem;">Zur Anmeldung / Website</a>` : ''}
      `;
      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    applyFilters();
  </script>
</body>
</html>
