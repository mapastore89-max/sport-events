<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWIM BIKE RUN — Triathlonkalender Schweiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #fafafa;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --border: #eaeaea;
      --border-hover: #111111;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 3rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* Header */
    header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 400;
      margin-top: 0.25rem;
    }

    /* Suche & Steuerung */
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .search-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--text-main);
    }

    /* Monatsunterteilung */
    .month-group {
      margin-bottom: 2.5rem;
    }

    .month-header {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .month-header .count {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Event Karten */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s, transform 0.1s;
    }

    .event-card:hover {
      border-color: var(--border-hover);
    }

    .event-info h3 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 0.35rem;
    }

    .event-info h3 a {
      text-decoration: none;
      color: inherit;
      transition: color 0.15s;
    }

    .event-info h3 a:hover {
      color: #5FA88C;
    }

    .event-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .source-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.4rem;
      background: #f0f0f0;
      border-radius: 4px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .event-action a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--text-main);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius);
      transition: all 0.2s;
      white-space: nowrap;
      display: inline-block;
    }

    .event-action a:hover {
      background: var(--text-main);
      color: var(--card-bg);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Mobile Anpassungen */
    @media (max-width: 580px) {
      body { padding: 1.5rem 1rem; }
      .event-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.9rem;
      }
      .event-action { width: 100%; }
      .event-action a { display: block; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>SWIM BIKE RUN</h1>
      <p class="subtitle">Triathlonkalender Schweiz</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Event oder Ort suchen...">
    </div>

    <main id="eventContainer">
      <div class="empty-state">Events werden geladen...</div>
    </main>
  </div>

  <script>
    let allEvents = [];

    // Sauberes Entfernen von Schweiz / Switzerland / CH aus Ortsangaben
    function cleanLocation(loc) {
      if (!loc) return '';
      return loc
        .replace(/,\s*(CH|Switzerland|Schweiz|Suisse|Svizzera)\b/gi, '')
        .replace(/\b(CH|Switzerland|Schweiz|Suisse|Svizzera)\b/gi, '')
        .trim();
    }

    // Sichere Datumsformatierung (Verhindert 2001/2010 Fehler)
    function parseAndFormatDate(dateStr) {
      const defaultYear = new Date().getFullYear(); // Nimmt automatisch das aktuelle Jahr
      
      if (!dateStr || dateStr.toLowerCase().includes("tba")) {
        return { formatted: "Termin offen", monthKey: "Weitere Termine", sortDate: new Date(2099, 0) };
      }

      let year = defaultYear;
      let month = 0; // 0-indexed (Januar = 0)
      let day = 1;

      // 1. ISO-Format YYYY-MM-DD
      const isoMatch = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (isoMatch) {
        year = parseInt(isoMatch[1], 10);
        month = parseInt(isoMatch[2], 10) - 1;
        day = parseInt(isoMatch[3], 10);
      } else {
        // 2. Format DD.MM.YYYY oder DD.MM.
        const dotMatch = dateStr.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/);
        if (dotMatch) {
          day = parseInt(dotMatch[1], 10);
          month = parseInt(dotMatch[2], 10) - 1;
          if (dotMatch[3]) {
            let y = parseInt(dotMatch[3], 10);
            year = y < 100 ? 2000 + y : y;
          }
        } else {
          // 3. Textbasiertes Datum (z.B. "20. September")
          const monthsMap = {
            "jan": 0, "feb": 1, "mär": 2, "mar": 2, "apr": 3, "mai": 4, "jun": 5,
            "jul": 6, "aug": 7, "sep": 8, "okt": 9, "nov": 10, "dez": 11
          };
          const textMatch = dateStr.match(/(\d{1,2})\.?\s*([a-zA-zäöüÄÖÜ]+)/);
          if (textMatch) {
            day = parseInt(textMatch[1], 10);
            const mStr = textMatch[2].toLowerCase().substring(0, 3);
            if (monthsMap[mStr] !== undefined) {
              month = monthsMap[mStr];
            }
          }
        }
      }

      // Korrektur: Falls das geparste Jahr absurd ist (< 2024), erwinge das aktuelle/nächste Jahr
      if (year < 2024) {
        year = defaultYear;
      }

      const dateObj = new Date(year, month, day);
      
      const formatted = dateObj.toLocaleDateString('de-CH', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });

      const monthName = dateObj.toLocaleDateString('de-CH', { month: 'long' });
      const monthKey = `${monthName} ${year}`;

      return { formatted, monthKey, sortDate: dateObj };
    }

    async function fetchEvents() {
      const container = document.getElementById('eventContainer');
      try {
        const res = await fetch('./events.json');
        if (!res.ok) throw new Error('Events konnten nicht geladen werden.');
        
        allEvents = await res.json();
        renderEvents(allEvents);
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Fehler beim Laden der Events.</div>';
      }
    }

    function renderEvents(events) {
      const container = document.getElementById('eventContainer');

      if (events.length === 0) {
        container.innerHTML = '<div class="empty-state">Keine passenden Events gefunden.</div>';
        return;
      }

      const processedEvents = events.map((e, index) => {
        const dateObj = parseAndFormatDate(e.date);
        const eventId = e.id || index;

        return {
          id: eventId,
          title: e.title,
          link: e.link,
          source: e.source,
          cleanLoc: cleanLocation(e.location),
          dateFormatted: dateObj.formatted,
          monthKey: dateObj.monthKey,
          sortDate: dateObj.sortDate
        };
      });

      // Nach Datum sortieren
      processedEvents.sort((a, b) => a.sortDate - b.sortDate);

      // Nach Monaten gruppieren
      const grouped = {};
      processedEvents.forEach(e => {
        if (!grouped[e.monthKey]) grouped[e.monthKey] = [];
        grouped[e.monthKey].push(e);
      });

      let html = '';
      for (const [month, monthEvents] of Object.entries(grouped)) {
        html += `
          <section class="month-group">
            <div class="month-header">
              <span>${month}</span>
              <span class="count">${monthEvents.length} Event${monthEvents.length > 1 ? 's' : ''}</span>
            </div>
            <div class="event-list">
              ${monthEvents.map(e => `
                <article class="event-card">
                  <div class="event-info">
                    <h3>
                      <a href="event-details.html?id=${encodeURIComponent(e.id)}&title=${encodeURIComponent(e.title)}">
                        ${escapeHtml(e.title)}
                      </a>
                    </h3>
                    <div class="event-meta">
                      <span>📅 ${escapeHtml(e.dateFormatted)}</span>
                      ${e.cleanLoc ? `<span>📍 ${escapeHtml(e.cleanLoc)}</span>` : ''}
                      ${e.source ? `<span class="source-badge">${escapeHtml(e.source)}</span>` : ''}
                    </div>
                  </div>
                  <div class="event-action">
                    <a href="event-details.html?id=${encodeURIComponent(e.id)}&title=${encodeURIComponent(e.title)}">
                      Details ↗
                    </a>
                  </div>
                </article>
              `).join('')}
            </div>
          </section>
        `;
      }

      container.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // Such-Filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allEvents.filter(event => 
        (event.title && event.title.toLowerCase().includes(query)) || 
        (event.location && event.location.toLowerCase().includes(query))
      );
      renderEvents(filtered);
    });

    fetchEvents();
  </script>
</body>
</html>
