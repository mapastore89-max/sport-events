<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Events Calendar</title>
  
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1c1c1e;
      --card-hover: #26262a;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f3f4f6;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --tag-bg: #27272a;
      --icon-gray: #a1a1aa;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    p.sub { color: var(--text-muted); font-size: 1.1rem; }

    /* CATEGORY TABS & FILTERS */
    .tabs { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .tab-btn {
      background: var(--card-bg); color: var(--text); border: 1px solid var(--border);
      padding: 0.75rem 1.5rem; border-radius: 99px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .tab-btn:hover, .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .filter-bar { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    input, select {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.95rem; flex: 1; min-width: 180px;
    }

    /* MONATS-GRUPPEN */
    .month-group { margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card-bg); }
    .month-header {
      padding: 1rem 1.5rem; background: #18181a; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; user-select: none;
    }
    .month-title { font-size: 1.25rem; font-weight: bold; display: flex; align-items: center; gap: 0.6rem; }
    .calendar-icon { width: 18px; height: 18px; fill: var(--icon-gray); vertical-align: middle; }
    .month-count { font-size: 0.85rem; background: var(--tag-bg); color: var(--text-muted); padding: 0.2rem 0.6rem; border-radius: 99px; }
    .month-events { display: flex; flex-direction: column; gap: 1rem; padding: 1.25rem; border-top: 1px solid var(--border); }
    .month-group.collapsed .month-events { display: none; }

    /* EVENT CARD */
    .event-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem 1.5rem;
      display: grid; grid-template-columns: 120px 1fr auto; align-items: center; gap: 1.5rem; cursor: pointer;
    }
    .event-card:hover { border-color: #3f3f46; background: #161618; }

    .date-box {
      background: var(--tag-bg); border-radius: 8px; padding: 0.5rem; text-align: center; border: 1px solid var(--border);
    }
    .date-box .day { font-size: 1.4rem; font-weight: bold; color: var(--accent); display: block; }
    .date-box .month { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); }
    .date-box .countdown { margin-top: 0.4rem; padding-top: 0.4rem; border-top: 1px solid var(--border); font-size: 0.75rem; font-weight: bold; color: var(--accent); }

    .event-info h3 { margin: 0 0 0.3rem 0; font-size: 1.25rem; }
    .event-meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tag { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }

    .btn { padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; border: none; text-decoration: none; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }

    /* TRI-NORTHWEST STYLE EVENT DETAIL PAGE */
    #detailView { display: none; }
    .back-nav { margin-bottom: 2rem; }
    
    .event-header-block {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; margin-bottom: 2rem;
    }
    .event-header-block h2 { font-size: 2rem; margin: 0.5rem 0 1rem 0; }
    
    .detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
    .detail-main, .detail-sidebar { display: flex; flex-direction: column; gap: 1.5rem; }

    .detail-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;
    }
    .detail-card h3 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }

    .info-list { list-style: none; padding: 0; margin: 0; }
    .info-list li { margin-bottom: 0.8rem; font-size: 0.95rem; color: var(--text-muted); }
    .info-list li strong { color: var(--text); }

    @media (max-width: 768px) {
      .event-card { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div id="listView">
      <header>
        <h1>Rennkalender 2026</h1>
        <p class="sub">Finde deine nächsten Events & Wettkämpfe</p>
      </header>

      <div class="tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)">Alle Events</button>
        <button class="tab-btn" onclick="filterCategory('Triathlon', this)">Triathlon</button>
        <button class="tab-btn" onclick="filterCategory('Laufen', this)">Laufen</button>
        <button class="tab-btn" onclick="filterCategory('Rennrad', this)">Rennrad</button>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Nach Event oder Ort suchen..." oninput="applyFilters()">
        <select id="countryFilter" onchange="applyFilters()">
          <option value="all">Alle Länder</option>
          <option value="CH">Schweiz 🇨🇭</option>
          <option value="DE">Deutschland 🇩🇪</option>
          <option value="AT">Österreich 🇦🇹</option>
        </select>
      </div>

      <div id="eventContainer"></div>
    </div>

    <div id="detailView">
      <div class="back-nav">
        <button class="btn btn-outline" onclick="showListView()">← Zurück zur Übersicht</button>
      </div>
      <div id="detailContent"></div>
    </div>

  </div>

  <script>
    const events = [
      {
        id: 1,
        title: 'Spiezathlon 2026',
        category: 'Triathlon',
        date: '2026-06-20',
        time: '08:00 Uhr',
        location: 'Bucht Spiez, Schweiz',
        country: 'CH',
        organizer: 'Triathlon Club Spiez',
        distances: ['Olympic (1.5k / 40k / 10k)', 'Sprint (500m / 20k / 5k)'],
        desc: 'Der Spiezathlon bietet eine atemberaubende Kulisse direkt am Thunersee mit Blick auf das Schloss Spiez. Ein Muss für alle Triathleten in der Schweiz!',
        schedule: '07:00 Startnummernausgabe | 08:30 Start Olympic | 11:00 Start Sprint | 14:00 Rangverlesung',
        link: 'https://spiezathlon.ch'
      },
      {
        id: 2,
        title: 'Zürich Triathlon',
        category: 'Triathlon',
        date: '2026-06-27',
        time: '07:30 Uhr',
        location: 'Landiwiese, Zürich, Schweiz',
        country: 'CH',
        organizer: 'IRONMAN Switzerland AG',
        distances: ['Standard Distance', 'Sprint Distance'],
        desc: 'Schwimmen im Zürichsee, eine schnelle Radstrecke entlang der Goldküste und ein stimmungsvoller Lauf im Herzen von Zürich.',
        schedule: '06:30 Wechselzone öffnet | 07:30 Start Wellen | 15:00 Event-Ende',
        link: 'https://www.ironman.com'
      }
    ];

    let activeCategory = 'all';

    const calendarIconSVG = `<svg class="calendar-icon" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>`;

    function getCountdownText(eventDateStr) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const eventDate = new Date(eventDateStr); eventDate.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((eventDate - today) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) return { text: 'Vorüber', isPast: true };
      if (diffDays === 0) return { text: 'Heute!', isPast: false };

      const weeks = Math.floor(diffDays / 7);
      const days = diffDays % 7;
      let parts = [];
      if (weeks > 0) parts.push(`${weeks} Wo.`);
      if (days > 0 || weeks === 0) parts.push(`${days} Tg.`);
      return { text: `In ${parts.join(' ')}`, isPast: false };
    }

    function renderGroupedList(data) {
      const container = document.getElementById('eventContainer');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 2rem;">Keine passenden Events gefunden.</p>';
        return;
      }

      data.sort((a, b) => new Date(a.date) - new Date(b.date));

      const grouped = {};
      data.forEach(event => {
        const d = new Date(event.date);
        const monthKey = d.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
        if (!grouped[monthKey]) grouped[monthKey] = [];
        grouped[monthKey].push(event);
      });

      Object.keys(grouped).forEach(monthName => {
        const monthEvents = grouped[monthName];

        const monthGroup = document.createElement('div');
        monthGroup.className = 'month-group';

        const monthHeader = document.createElement('div');
        monthHeader.className = 'month-header';
        monthHeader.onclick = () => monthGroup.classList.toggle('collapsed');
        monthHeader.innerHTML = `
          <div class="month-title">
            ${calendarIconSVG} ${monthName}
            <span class="month-count">${monthEvents.length} Event${monthEvents.length > 1 ? 's' : ''}</span>
          </div>
          <span style="color:var(--accent);">▼</span>
        `;

        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'month-events';

        monthEvents.forEach(event => {
          const d = new Date(event.date);
          const day = d.getDate().toString().padStart(2, '0');
          const monthShort = d.toLocaleString('de-DE', { month: 'short' }).toUpperCase();
          const countdown = getCountdownText(event.date);

          const card = document.createElement('div');
          card.className = 'event-card';
          card.onclick = () => openDetailPage(event.id);
          card.innerHTML = `
            <div class="date-box">
              <span class="day">${day}</span>
              <span class="month">${monthShort}</span>
              <span class="countdown ${countdown.isPast ? 'past' : ''}">${countdown.text}</span>
            </div>
            <div class="event-info">
              <h3>${event.title}</h3>
              <div class="event-meta">📍 ${event.location}</div>
              <div class="tags">
                <span class="tag">${event.category}</span>
                ${event.distances.map(dist => `<span class="tag" style="background:var(--tag-bg); color:var(--text-muted);">${dist}</span>`).join('')}
              </div>
            </div>
            <div>
              <button class="btn btn-primary" onclick="event.stopPropagation(); openDetailPage(${event.id})">Details</button>
            </div>
          `;
          eventsContainer.appendChild(card);
        });

        monthGroup.appendChild(monthHeader);
        monthGroup.appendChild(eventsContainer);
        container.appendChild(monthGroup);
      });
    }

    /* WECHSEL ZUR DETAILSEITE */
    function openDetailPage(id) {
      const ev = events.find(e => e.id === id);
      if (!ev) return;

      const formattedDate = new Date(ev.date).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      const countdown = getCountdownText(ev.date);

      document.getElementById('detailContent').innerHTML = `
        <div class="event-header-block">
          <span class="tag">${ev.category}</span>
          <h2>${ev.title}</h2>
          <p style="color:var(--text-muted); margin: 0;">📅 ${formattedDate} (${countdown.text}) | 📍 ${ev.location}</p>
        </div>

        <div class="detail-grid">
          <div class="detail-main">
            <div class="detail-card">
              <h3>Beschreibung</h3>
              <p style="line-height:1.6; color:var(--text-muted);">${ev.desc}</p>
            </div>
            <div class="detail-card">
              <h3>Distanzen & Kategorien</h3>
              <ul class="info-list">
                ${ev.distances.map(d => `<li><strong>• ${d}</strong></li>`).join('')}
              </ul>
            </div>
            <div class="detail-card">
              <h3>Ablauf & Zeitplan</h3>
              <p style="color:var(--text-muted);">${ev.schedule || 'Zeitplan wird in Kürze bekanntgegeben.'}</p>
            </div>
          </div>

          <div class="detail-sidebar">
            <div class="detail-card">
              <h3>Event-Infos</h3>
              <ul class="info-list">
                <li><strong>Datum:</strong><br>${formattedDate}</li>
                <li><strong>Startzeit:</strong><br>${ev.time || 'TBA'}</li>
                <li><strong>Ort:</strong><br>${ev.location}</li>
                <li><strong>Veranstalter:</strong><br>${ev.organizer || 'k. A.'}</li>
              </ul>
              ${ev.link && ev.link !== '#' ? `<a href="${ev.link}" target="_blank" class="btn btn-primary" style="display:block; text-align:center; margin-top:1.5rem;">Anmeldung & Website</a>` : ''}
              <a href="https://maps.google.com/?q=${encodeURIComponent(ev.location)}" target="_blank" class="btn btn-outline" style="display:block; text-align:center; margin-top:0.5rem;">Auf Google Maps anzeigen</a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showListView() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const country = document.getElementById('countryFilter').value;

      const filtered = events.filter(e => {
        const matchCat = activeCategory === 'all' || e.category === activeCategory;
        const matchSearch = e.title.toLowerCase().includes(search) || e.location.toLowerCase().includes(search);
        const matchCountry = country === 'all' || e.country === country;
        return matchCat && matchSearch && matchCountry;
      });

      renderGroupedList(filtered);
    }

    applyFilters();
  </script>
</body>
</html>
