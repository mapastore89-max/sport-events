<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWIM BIKE RUN — Triathlonkalender Schweiz</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Passend zur Detailseite) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .font-display {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="bg-[#0E1518] text-[#E6E1D6] min-h-screen antialiased p-4 sm:p-8">

  <div class="max-w-3xl mx-auto space-y-8">
    
    <!-- HEADER -->
    <header class="space-y-3 border-b border-[#26363D] pb-6">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2">
        <div>
          <h1 class="font-display text-4xl sm:text-6xl text-[#F2EFE7] leading-none tracking-wider">
            SWIM BIKE RUN
          </h1>
          <p class="text-xs sm:text-sm text-[#A7B0B4] font-medium tracking-wide uppercase mt-1">
            Triathlonkalender Schweiz
          </p>
        </div>
      </div>
      
      <!-- Dreifarbige Akzent-Linie -->
      <div class="flex h-1 w-28 overflow-hidden rounded-full">
        <span class="flex-1 bg-[#5FA88C]"></span>
        <span class="flex-1 bg-[#F2A83E]"></span>
        <span class="flex-1 bg-[#E2694A]"></span>
      </div>
    </header>

    <!-- SUCHE & FILTER -->
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#7C8A90]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
      </div>
      <input 
        type="text" 
        id="searchInput" 
        class="w-full bg-[#172126] border border-[#26363D] focus:border-[#F2A83E] text-[#E6E1D6] placeholder-[#7C8A90] text-sm rounded-xl pl-10 pr-4 py-3 outline-none transition-colors"
        placeholder="Event oder Ort suchen..."
      >
    </div>

    <!-- MAIN EVENT CONTAINER -->
    <main id="eventContainer" class="space-y-8">
      <div class="text-center py-12 text-[#7C8A90] text-sm">
        Events werden geladen...
      </div>
    </main>

    <script>
    let allEvents = [];

    function cleanLocation(loc) {
      if (!loc) return '';
      return loc
        .replace(/,\s*(CH|Switzerland|Schweiz|Suisse|Svizzera)\b/gi, '')
        .replace(/\b(CH|Switzerland|Schweiz|Suisse|Svizzera)\b/gi, '')
        .trim();
    }

    function parseAndFormatDate(dateStr) {
      const defaultYear = 2026;
      
      if (!dateStr || dateStr.toLowerCase().includes("tba")) {
        return { formatted: "Termin offen", monthKey: "Weitere Termine", sortDate: new Date(2099, 0) };
      }

      let year = defaultYear;
      let month = 0;
      let day = 1;

      const isoMatch = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (isoMatch) {
        year = parseInt(isoMatch[1], 10);
        month = parseInt(isoMatch[2], 10) - 1;
        day = parseInt(isoMatch[3], 10);
      } else {
        const dotMatch = dateStr.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/);
        if (dotMatch) {
          day = parseInt(dotMatch[1], 10);
          month = parseInt(dotMatch[2], 10) - 1;
          if (dotMatch[3]) {
            let y = parseInt(dotMatch[3], 10);
            year = y < 100 ? 2000 + y : y;
          }
        } else {
          const monthsMap = {
            "jan": 0, "feb": 1, "mär": 2, "mar": 2, "apr": 3, "mai": 4, "jun": 5,
            "jul": 6, "aug": 7, "sep": 8, "okt": 9, "nov": 10, "dez": 11
          };
          const textMatch = dateStr.match(/(\d{1,2})\.?\s*([a-zA-zäöüÄÖÜ]+)/);
          if (textMatch) {
            day = parseInt(textMatch[1], 10);
            const mStr = textMatch[2].toLowerCase().substring(0, 3);
            if (monthsMap[mStr] !== undefined) {
              month = monthsMap[mStr];
            }
          }
        }
      }

      if (year < 2024) year = defaultYear;

      const dateObj = new Date(year, month, day);
      const formatted = dateObj.toLocaleDateString('de-CH', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });

      const monthName = dateObj.toLocaleDateString('de-CH', { month: 'long' });
      const monthKey = `${monthName} ${year}`;

      return { formatted, monthKey, sortDate: dateObj };
    }

    async function fetchEvents() {
      const container = document.getElementById('eventContainer');
      try {
        const res = await fetch('./events.json');
        if (!res.ok) throw new Error('Events konnten nicht geladen werden.');
        
        allEvents = await res.json();
        renderEvents(allEvents);
      } catch (err) {
        container.innerHTML = '<div class="text-center py-12 text-[#7C8A90] text-sm">Fehler beim Laden der Events.</div>';
      }
    }

    // Speichert das Event temporär ab und leitet zur Detailseite weiter
    function openEventDetails(eventObj) {
      localStorage.setItem('selectedEvent', JSON.stringify(eventObj));
      window.location.href = 'event-details.html';
    }

    function renderEvents(events) {
      const container = document.getElementById('eventContainer');

      if (events.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-[#7C8A90] text-sm">Keine passenden Events gefunden.</div>';
        return;
      }

      const processedEvents = events.map((e, index) => {
        const dateObj = parseAndFormatDate(e.date);
        return {
          ...e,
          id: e.id || index,
          cleanLoc: cleanLocation(e.location),
          dateFormatted: dateObj.formatted,
          monthKey: dateObj.monthKey,
          sortDate: dateObj.sortDate
        };
      });

      processedEvents.sort((a, b) => a.sortDate - b.sortDate);

      const grouped = {};
      processedEvents.forEach(e => {
        if (!grouped[e.monthKey]) grouped[e.monthKey] = [];
        grouped[e.monthKey].push(e);
      });

      let html = '';
      for (const [month, monthEvents] of Object.entries(grouped)) {
        html += `
          <section class="space-y-3">
            <div class="flex items-center justify-between border-b border-[#26363D] pb-2">
              <h2 class="text-sm font-bold uppercase tracking-wider text-[#F2A83E]">${month}</h2>
              <span class="text-xs text-[#7C8A90] font-medium">${monthEvents.length} Event${monthEvents.length > 1 ? 's' : ''}</span>
            </div>
            
            <div class="space-y-2.5">
              ${monthEvents.map((e, idx) => {
                // Wir übergeben das Event-Objekt sicher als JSON an die Klick-Funktion
                const eventJson = encodeURIComponent(JSON.stringify(e));
                return `
                  <article class="bg-[#172126] border border-[#26363D] hover:border-[#5FA88C] rounded-xl p-4 sm:p-5 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4 group cursor-pointer"
                           onclick="openEventDetails(JSON.parse(decodeURIComponent('${eventJson}')))">
                    <div class="space-y-1.5 pointer-events-none">
                      <h3 class="font-bold text-base sm:text-lg text-[#F2EFE7] group-hover:text-[#5FA88C] transition-colors">
                        ${escapeHtml(e.title)}
                      </h3>
                      
                      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-[#A7B0B4]">
                        <span class="flex items-center gap-1">
                          <span class="text-[#F2A83E]">📅</span>
                          <span>${escapeHtml(e.dateFormatted)}</span>
                        </span>
                        ${e.cleanLoc ? `
                          <span class="flex items-center gap-1">
                            <span class="text-[#A7B0B4]">📍</span>
                            <span>${escapeHtml(e.cleanLoc)}</span>
                          </span>
                        ` : ''}
                        ${e.source ? `
                          <span class="bg-[#26363D] text-[#9FCFC0] text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded">
                            ${escapeHtml(e.source)}
                          </span>
                        ` : ''}
                      </div>
                    </div>

                    <div class="shrink-0">
                      <span class="inline-flex items-center gap-1.5 bg-[#26363D] group-hover:bg-[#F2A83E] text-[#E6E1D6] group-hover:text-[#0E1518] font-bold text-xs uppercase px-4 py-2 rounded-lg transition-colors w-full sm:w-auto justify-center">
                        <span>Details</span>
                        <svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H18m0 0v4.5m0-4.5L8.25 17.25"/>
                        </svg>
                      </span>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          </section>
        `;
      }

      container.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allEvents.filter(event => 
        (event.title && event.title.toLowerCase().includes(query)) || 
        (event.location && event.location.toLowerCase().includes(query))
      );
      renderEvents(filtered);
    });

    fetchEvents();
  </script>
