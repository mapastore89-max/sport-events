<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Events Calendar</title>
  
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --card-hover: #26262a;
      --border: #2d2d2d;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-gray: #e5e7eb;
      --tag-bg: #2a2a2d;
      --icon-gray: #9ca3af;

      /* Disziplinen Akzentfarben */
      --swim-color: #3b82f6;
      --bike-color: #22c55e;
      --run-color: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    p.sub { color: var(--text-muted); font-size: 1.1rem; }

    /* LIST VIEW: TABS & FILTER */
    .tabs { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .tab-btn {
      background: var(--card-bg); color: var(--text); border: 1px solid var(--border);
      padding: 0.75rem 1.5rem; border-radius: 99px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .tab-btn:hover, .tab-btn.active { background: var(--accent-gray); color: #121212; border-color: var(--accent-gray); }

    .filter-bar { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    input, select {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.95rem; flex: 1; min-width: 180px;
    }

    /* MONATS-GRUPPEN */
    .month-group { margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card-bg); }
    .month-header {
      padding: 1rem 1.5rem; background: #18181a; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; user-select: none;
    }
    .month-title { font-size: 1.25rem; font-weight: bold; display: flex; align-items: center; gap: 0.6rem; }
    .calendar-icon { width: 18px; height: 18px; fill: var(--icon-gray); vertical-align: middle; }
    .month-count { font-size: 0.85rem; background: var(--tag-bg); color: var(--text-muted); padding: 0.2rem 0.6rem; border-radius: 99px; }
    .month-events { display: flex; flex-direction: column; gap: 1rem; padding: 1.25rem; border-top: 1px solid var(--border); }
    .month-group.collapsed .month-events { display: none; }

    /* EVENT CARD (ÜBERSICHT) */
    .event-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem 1.5rem;
      display: grid; grid-template-columns: 120px 1fr auto; align-items: center; gap: 1.5rem; cursor: pointer;
    }
    .event-card:hover { border-color: #404040; background: #161618; }

    .date-box {
      background: var(--tag-bg); border-radius: 8px; padding: 0.5rem; text-align: center; border: 1px solid var(--border);
    }
    .date-box .day { font-size: 1.4rem; font-weight: bold; color: var(--text); display: block; }
    .date-box .month { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); }
    .date-box .countdown { margin-top: 0.4rem; padding-top: 0.4rem; border-top: 1px solid var(--border); font-size: 0.75rem; font-weight: bold; color: var(--accent-gray); }

    .event-info h3 { margin: 0 0 0.3rem 0; font-size: 1.25rem; }
    .event-meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tag { background: var(--tag-bg); color: var(--accent-gray); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; border: 1px solid var(--border); }

    .btn { padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; border: none; text-decoration: none; display: inline-block; text-align: center; }
    .btn-primary { background: var(--accent-gray); color: #121212; }
    .btn-primary:hover { background: #ffffff; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--tag-bg); }

    /* DETAIL ANSICHT */
    #detailView { display: none; }
    .back-nav { margin-bottom: 1.5rem; }

    /* Hero Header */
    .event-hero {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      margin-bottom: 2rem;
    }
    .event-hero .breadcrumbs { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
    .event-hero h1 { text-align: left; font-size: 2.2rem; margin: 0 0 1rem 0; color: #ffffff; }
    .hero-meta { display: flex; gap: 1.5rem; flex-wrap: wrap; color: var(--text-muted); font-size: 1rem; align-items: center; }
    .hero-meta-item { display: flex; align-items: center; gap: 0.5rem; }

    /* Layout 2-Spaltig */
    .detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
    .detail-main, .detail-sidebar { display: flex; flex-direction: column; gap: 1.5rem; }

    /* Content Cards */
    .content-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.8rem;
    }
    .content-box h3 {
      margin: 0 0 1.2rem 0;
      font-size: 1.25rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .content-box p { line-height: 1.7; color: var(--text-muted); margin: 0 0 1rem 0; }

    /* NEUE WETTKAMPF / DISTANZEN DARSTELLUNG */
    .race-category-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .race-category-card:last-child {
      margin-bottom: 0;
    }
    .race-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 1rem 0;
    }
    .discipline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.8rem;
    }
    .discipline-subcard {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .discipline-icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      flex-shrink: 0;
    }
    .discipline-icon-box svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .discipline-info {
      display: flex;
      flex-direction: column;
    }
    .discipline-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .discipline-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 0.1rem;
    }

    /* Disziplinen Farben & Icon Stroke Colors */
    .discipline-subcard.swim { border-left: 3px solid var(--swim-color); }
    .discipline-subcard.swim .discipline-label { color: var(--swim-color); }
    .discipline-subcard.swim .discipline-icon-box svg { stroke: var(--swim-color); }
    
    .discipline-subcard.bike { border-left: 3px solid var(--bike-color); }
    .discipline-subcard.bike .discipline-label { color: var(--bike-color); }
    .discipline-subcard.bike .discipline-icon-box svg { stroke: var(--bike-color); }
    
    .discipline-subcard.run { border-left: 3px solid var(--run-color); }
    .discipline-subcard.run .discipline-label { color: var(--run-color); }
    .discipline-subcard.run .discipline-icon-box svg { stroke: var(--run-color); }

    /* Sidebar Table / Info Pairs */
    .info-group { display: flex; flex-direction: column; gap: 1rem; }
    .info-pair { display: flex; flex-direction: column; gap: 0.2rem; }
    .info-pair label { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
    .info-pair span { font-size: 1rem; color: var(--text); font-weight: 500; }

    @media (max-width: 768px) {
      .event-card { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .event-hero { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div id="listView">
      <header>
        <h1>Rennkalender 2026</h1>
        <p class="sub">Finde deine nächsten Events & Wettkämpfe</p>
      </header>

      <div class="tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)">Alle Events</button>
        <button class="tab-btn" onclick="filterCategory('Triathlon', this)">Triathlon</button>
        <button class="tab-btn" onclick="filterCategory('Laufen', this)">Laufen</button>
        <button class="tab-btn" onclick="filterCategory('Rennrad', this)">Rennrad</button>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Nach Event oder Ort suchen..." oninput="applyFilters()">
        <select id="countryFilter" onchange="applyFilters()">
          <option value="all">Alle Länder</option>
          <option value="CH">Schweiz 🇨🇭</option>
          <option value="DE">Deutschland 🇩🇪</option>
          <option value="AT">Österreich 🇦🇹</option>
        </select>
      </div>

      <div id="eventContainer"></div>
    </div>

    <div id="detailView">
      <div class="back-nav">
        <button class="btn btn-outline" onclick="showListView()">← Zurück zum Kalender</button>
      </div>
      <div id="detailContent"></div>
    </div>

  </div>

  <script>
    const events = [
      {
        id: 1,
        title: 'Spiezathlon 2026',
        category: 'Triathlon',
        date: '2026-06-20',
        time: '08:00 Uhr',
        location: 'Spiez, Schweiz',
        venue: 'Bucht Spiez',
        country: 'CH',
        organizer: 'Triathlon Club Spiez',
        distances: [
          { 
            name: 'Olympic Distance', 
            swimMeters: 1500, 
            bikeKm: 40, 
            runKm: 10 
          },
          { 
            name: 'Sprint Distance', 
            swimMeters: 500, 
            bikeKm: 20, 
            runKm: 5 
          }
        ],
        desc: 'Der Spiezathlon gehört zu den malerischsten Wettkämpfen im Schweizer Rennkalender. Schwimmen im klaren Thunersee, eine anspruchsvolle Radstrecke mit Blick auf die Alpen und ein Zieleinlauf vor dem Schloss Spiez machen dieses Event einzigartig.',
        schedule: '07:00 - Startnummernausgabe | 08:30 - Start Olympic | 11:00 - Start Sprint | 14:00 - Siegerehrung',
        link: 'https://spiezathlon.ch'
      },
      {
        id: 2,
        title: 'Zürich Triathlon',
        category: 'Triathlon',
        date: '2026-06-27',
        time: '07:30 Uhr',
        location: 'Zürich, Schweiz',
        venue: 'Landiwiese Zürich',
        country: 'CH',
        organizer: 'IRONMAN Switzerland AG',
        distances: [
          { 
            name: '5150 Standard', 
            swimMeters: 1500, 
            bikeKm: 40, 
            runKm: 10 
          },
          { 
            name: '4184 Sprint', 
            swimMeters: 400, 
            bikeKm: 18, 
            runKm: 4.2 
          }
        ],
        desc: 'Der Zürich Triathlon bietet urbanes Feeling gepaart mit malerischer Naturkulisse. Die flache, schnelle Laufstrecke entlang der Uferpromenade ist ideal für persönliche Bestzeiten.',
        schedule: '06:30 - Wechselzone öffnet | 07:30 - Start Wellen | 15:00 - Ende des Wettkampfs',
        link: 'https://www.ironman.com'
      }
    ];

    let activeCategory = 'all';

    /* SVG OUTLINE ICONS */
    const calendarIconSVG = `<svg class="calendar-icon" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>`;
    
    // Schwimmen: Wellen
    const swimIconSVG = `<svg viewBox="0 0 24 24"><path d="M2 12c1.5 0 2.5-1 4-1s2.5 1 4 1 2.5-1 4-1 2.5 1 4 1 2.5-1 4-1M2 17c1.5 0 2.5-1 4-1s2.5 1 4 1 2.5-1 4-1 2.5 1 4 1 2.5-1 4-1"/></svg>`;
    
    // Radfahren: Rennrad
    const bikeIconSVG = `<svg viewBox="0 0 24 24"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h2m-5 0h3l-3 6.5H6.5L10 6h2m3 11.5L12 9l-2.5 3.5"/></svg>`;
    
    // Laufen: Laufschuh
    const runIconSVG = `<svg viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.6-1.7-1.5-1.9L15 10l-3-4H8L5 9v3h3l2.5 3H19zM2 17h15v2H2z"/></svg>`;

    function getCountdownText(eventDateStr) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const eventDate = new Date(eventDateStr); eventDate.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((eventDate - today) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) return { text: 'Vorüber', isPast: true };
      if (diffDays === 0) return { text: 'Heute!', isPast: false };

      const weeks = Math.floor(diffDays / 7);
      const days = diffDays % 7;
      let parts = [];
      if (weeks > 0) parts.push(`${weeks} Wo.`);
      if (days > 0 || weeks === 0) parts.push(`${days} Tg.`);
      return { text: `In ${parts.join(' ')}`, isPast: false };
    }

    function renderGroupedList(data) {
      const container = document.getElementById('eventContainer');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 2rem;">Keine passenden Events gefunden.</p>';
        return;
      }

      data.sort((a, b) => new Date(a.date) - new Date(b.date));

      const grouped = {};
      data.forEach(event => {
        const d = new Date(event.date);
        const monthKey = d.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
        if (!grouped[monthKey]) grouped[monthKey] = [];
        grouped[monthKey].push(event);
      });

      Object.keys(grouped).forEach(monthName => {
        const monthEvents = grouped[monthName];

        const monthGroup = document.createElement('div');
        monthGroup.className = 'month-group';

        const monthHeader = document.createElement('div');
        monthHeader.className = 'month-header';
        monthHeader.onclick = () => monthGroup.classList.toggle('collapsed');
        monthHeader.innerHTML = `
          <div class="month-title">
            ${calendarIconSVG} ${monthName}
            <span class="month-count">${monthEvents.length} Event${monthEvents.length > 1 ? 's' : ''}</span>
          </div>
          <span style="color:var(--text-muted);">▼</span>
        `;

        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'month-events';

        monthEvents.forEach(event => {
          const d = new Date(event.date);
          const day = d.getDate().toString().padStart(2, '0');
          const monthShort = d.toLocaleString('de-DE', { month: 'short' }).toUpperCase();
          const countdown = getCountdownText(event.date);

          const card = document.createElement('div');
          card.className = 'event-card';
          card.onclick = () => openDetailPage(event.id);
          card.innerHTML = `
            <div class="date-box">
              <span class="day">${day}</span>
              <span class="month">${monthShort}</span>
              <span class="countdown ${countdown.isPast ? 'past' : ''}">${countdown.text}</span>
            </div>
            <div class="event-info">
              <h3>${event.title}</h3>
              <div class="event-meta">📍 ${event.location}</div>
              <div class="tags">
                <span class="tag">${event.category}</span>
                ${event.distances.map(dist => `<span class="tag" style="background:var(--tag-bg); color:var(--text-muted);">${dist.name}</span>`).join('')}
              </div>
            </div>
            <div>
              <button class="btn btn-primary" onclick="event.stopPropagation(); openDetailPage(${event.id})">Details</button>
            </div>
          `;
          eventsContainer.appendChild(card);
        });

        monthGroup.appendChild(monthHeader);
        monthGroup.appendChild(eventsContainer);
        container.appendChild(monthGroup);
      });
    }

    function openDetailPage(id) {
      const ev = events.find(e => e.id === id);
      if (!ev) return;

      const formattedDate = new Date(ev.date).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      const countdown = getCountdownText(ev.date);

      document.getElementById('detailContent').innerHTML = `
        <div class="event-hero">
          <div class="breadcrumbs">Events / ${ev.category}</div>
          <h1>${ev.title}</h1>
          <div class="hero-meta">
            <div class="hero-meta-item">📅 <span>${formattedDate}</span></div>
            <div class="hero-meta-item">⏱️ <span>${countdown.text}</span></div>
            <div class="hero-meta-item">📍 <span>${ev.location}</span></div>
          </div>
        </div>

        <div class="detail-grid">
          
          <div class="detail-main">
            
            <div class="content-box">
              <h3>Über das Event</h3>
              <p>${ev.desc}</p>
            </div>

            <div>
              ${ev.distances.map(d => `
                <div class="race-category-card">
                  <div class="race-title">${d.name}</div>
                  <div class="discipline-grid">
                    
                    ${d.swimMeters ? `
                    <div class="discipline-subcard swim">
                      <div class="discipline-icon-box">${swimIconSVG}</div>
                      <div class="discipline-info">
                        <span class="discipline-label">Schwimmen</span>
                        <span class="discipline-value">${d.swimMeters}m</span>
                      </div>
                    </div>` : ''}

                    ${d.bikeKm ? `
                    <div class="discipline-subcard bike">
                      <div class="discipline-icon-box">${bikeIconSVG}</div>
                      <div class="discipline-info">
                        <span class="discipline-label">Radfahren</span>
                        <span class="discipline-value">${d.bikeKm} km</span>
                      </div>
                    </div>` : ''}

                    ${d.runKm ? `
                    <div class="discipline-subcard run">
                      <div class="discipline-icon-box">${runIconSVG}</div>
                      <div class="discipline-info">
                        <span class="discipline-label">Laufen</span>
                        <span class="discipline-value">${d.runKm} km</span>
                      </div>
                    </div>` : ''}

                  </div>
                </div>
              `).join('')}
            </div>

            <div class="content-box">
              <h3>Ablauf & Zeitplan</h3>
              <p>${ev.schedule || 'Detaillierter Zeitplan folgt in Kürze.'}</p>
            </div>

          </div>

          <div class="detail-sidebar">
            
            <div class="content-box">
              <h3>Event Details</h3>
              <div class="info-group">
                <div class="info-pair">
                  <label>Datum</label>
                  <span>${formattedDate}</span>
                </div>
                <div class="info-pair">
                  <label>Startzeit</label>
                  <span>${ev.time || 'TBA'}</span>
                </div>
                <div class="info-pair">
                  <label>Austragungsort</label>
                  <span>${ev.venue || ev.location}</span>
                </div>
                <div class="info-pair">
                  <label>Veranstalter</label>
                  <span>${ev.organizer || 'k. A.'}</span>
                </div>
              </div>

              <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 0.8rem;">
                ${ev.link && ev.link !== '#' ? `<a href="${ev.link}" target="_blank" class="btn btn-primary" style="width:100%;">Offizielle Anmeldeseite</a>` : ''}
                <a href="https://maps.google.com/?q=${encodeURIComponent(ev.location)}" target="_blank" class="btn btn-outline" style="width:100%;">Google Maps Route</a>
              </div>
            </div>

          </div>

        </div>
      `;

      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showListView() {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const country = document.getElementById('countryFilter').value;

      const filtered = events.filter(e => {
        const matchCat = activeCategory === 'all' || e.category === activeCategory;
        const matchSearch = e.title.toLowerCase().includes(search) || e.location.toLowerCase().includes(search);
        const matchCountry = country === 'all' || e.country === country;
        return matchCat && matchSearch && matchCountry;
      });

      renderGroupedList(filtered);
    }

    applyFilters();
  </script>
</body>
</html>
