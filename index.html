<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWIM BIKE RUN – Triathlonkalender Schweiz</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1C1A17] text-[#E8E2D5] font-sans min-h-screen antialiased p-4 sm:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- HEADER BEREICH -->
    <header class="space-y-1 border-b border-[#3D3730] pb-6">
      <h1 class="text-3xl sm:text-5xl font-black tracking-wider uppercase text-[#E5A93C]">
        SWIM BIKE RUN
      </h1>
      <p class="text-sm sm:text-base text-[#C2B7A3] font-medium tracking-widest uppercase">
        Triathlonkalender Schweiz
      </p>
    </header>

    <!-- EVENT TABELLE / LISTE -->
    <div class="rounded-xl border border-[#3D3730] bg-[#282420] overflow-hidden shadow-2xl">
      
      <!-- Tabellen-Kopfzeile -->
      <div class="p-4 border-b border-[#3D3730] bg-[#211E1B] flex items-center justify-between">
        <div class="flex items-center gap-2.5 text-[#E5A93C] text-xs font-bold uppercase tracking-widest">
          <!-- Schlichtes Kalender Outline Icon -->
          <svg class="w-4 h-4 stroke-[#E5A93C]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
          </svg>
          <span id="event-counter">ANSTEHENDE EVENTS (0)</span>
        </div>
      </div>

      <!-- Spaltenüberschriften exakt an Grid angepasst (Desktop) -->
      <div class="hidden md:grid grid-cols-12 gap-2 px-4 py-3 text-[11px] font-bold text-[#A89F8D] uppercase tracking-wider border-b border-[#3D3730] bg-[#211E1B]/50">
        <div class="col-span-2">DATUM</div>
        <div class="col-span-2">VERBLEIBEND</div>
        <div class="col-span-3">EVENT</div>
        <div class="col-span-1">WEBSEITE</div>
        <div class="col-span-2">ORT</div>
        <div class="col-span-1">KATEGORIE</div>
        <div class="col-span-1 text-right">INFO</div>
      </div>

      <!-- ZIEL-CONTAINER FÜR MONATS-GRUPPIERTE EVENTS -->
      <div id="events-container" class="divide-y divide-[#3D3730] text-xs sm:text-sm">
        <div class="p-8 text-center text-[#A89F8D]">
          Events werden geladen...
        </div>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
