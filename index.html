<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport-Events Übersicht</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --card-hover: #2a2a2a;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2d2d2d;
      --modal-overlay: rgba(0, 0, 0, 0.75);
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 { margin-bottom: 0.5rem; font-size: 2rem; }

    /* CATEGORY SELECTION */
    .selection-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .category-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .category-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
    .category-card h2 { margin: 0; font-size: 1.4rem; }

    /* EVENT VIEW */
    #eventView { display: none; max-width: 1200px; margin: 0 auto; }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .btn-action {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-action:hover { background: var(--accent-hover); color: #fff; }

    .btn-back {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-back:hover { background: var(--card-hover); }

    #map {
      height: 380px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      z-index: 1;
    }

    /* FILTERS */
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    input, select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
    }

    /* GRID & CARDS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .badge {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .card h3 { margin: 0.5rem 0; font-size: 1.2rem; }
    .card .meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.4; }

    .card-footer {
      display: flex;
      gap: 0.5rem;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      font-weight: bold;
    }

    /* MODAL (Detailansicht & Formular) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-overlay);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 550px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <h1 id="mainTitle">Sportveranstaltungen 2026</h1>
    <p style="color: var(--text-muted)" id="subTitle">Wähle eine Sportart aus, um passende Events zu finden</p>
  </header>

  <!-- ANSICHT 1: VORAUSWAHL -->
  <div id="selectionView" class="selection-container">
    <div class="category-card" onclick="selectCategory('Laufen')">
      <span class="category-icon">🏃</span>
      <h2>Laufen</h2>
    </div>
    <div class="category-card" onclick="selectCategory('Triathlon')">
      <span class="category-icon">🏊🚴🏃</span>
      <h2>Triathlon</h2>
    </div>
    <div class="category-card" onclick="selectCategory('Rennrad')">
      <span class="category-icon">🚴</span>
      <h2>Rennrad</h2>
    </div>
  </div>

  <!-- ANSICHT 2: EVENT-DASHBOARD -->
  <div id="eventView">
    <div class="nav-bar">
      <button class="btn-back" onclick="showSelection()">← Zurück</button>
      <h2 id="currentCategoryTitle" style="margin: 0;"></h2>
      <button class="btn-action" onclick="openAddModal()">+ Event eintragen</button>
    </div>

    <div id="map"></div>

    <!-- FILTER -->
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Suche nach Name oder Ort..." oninput="filterEvents()">
      <select id="countryFilter" onchange="filterEvents()">
        <option value="all">Alle Länder</option>
        <option value="CH">Schweiz 🇨🇭</option>
        <option value="DE">Deutschland 🇩🇪</option>
        <option value="AT">Österreich 🇦🇹</option>
      </select>
      <select id="monthFilter" onchange="filterEvents()">
        <option value="all">Alle Monate</option>
        <option value="05">Mai</option>
        <option value="06">Juni</option>
        <option value="07">Juli</option>
        <option value="08">August</option>
        <option value="09">September</option>
      </select>
    </div>

    <div class="grid" id="eventGrid"></div>
  </div>

  <!-- MODAL 1: EVENT DETAILS -->
  <div id="detailModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'detailModal')">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- MODAL 2: EVENT EINTRAGEN FORMULAR -->
  <div id="addModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'addModal')">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('addModal')">&times;</button>
      <h2>Neues Event einreichen</h2>
      <form id="addEventForm" onsubmit="submitNewEvent(event)">
        <div class="form-group">
          <label>Titel des Events*</label>
          <input type="text" id="newTitle" required placeholder="z. B. Spiezathlon">
        </div>
        <div class="form-group">
          <label>Sportart*</label>
          <select id="newCategory" required>
            <option value="Laufen">Laufen</option>
            <option value="Triathlon">Triathlon</option>
            <option value="Rennrad">Rennrad</option>
          </select>
        </div>
        <div class="form-group">
          <label>Datum*</label>
          <input type="date" id="newDate" required>
        </div>
        <div class="form-group">
          <label>Ort & Land (z. B. Spiez, CH)*</label>
          <input type="text" id="newLocation" required placeholder="Stadt, Landcode (CH/DE/AT)">
        </div>
        <div class="form-group">
          <label>Distanzen / Infos</label>
          <input type="text" id="newDistances" placeholder="z. B. Olympic, Sprint">
        </div>
        <div class="form-group">
          <label>Website-Link</label>
          <input type="url" id="newLink" placeholder="https://...">
        </div>
        <button type="submit" class="btn-action" style="width: 100%; margin-top: 1rem;">Event speichern</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // INITIALE EVENTS-DATENBANK
    let events = [
      { id: 1, title: 'Berlin Marathon', category: 'Laufen', date: '2026-09-20', location: 'Berlin', country: 'DE', lat: 52.5200, lng: 13.4050, distances: '42.195 km', link: 'https://www.bmw-berlin-marathon.com' },
      { id: 2, title: 'City Night Run', category: 'Laufen', date: '2026-05-15', location: 'Frankfurt', country: 'DE', lat: 50.1109, lng: 8.6821, distances: '5 km, 10 km', link: '#' },
      { id: 3, title: 'Challenge Roth', category: 'Triathlon', date: '2026-07-05', location: 'Roth', country: 'DE', lat: 49.2464, lng: 11.0911, distances: '3.8km / 180km / 42.2km', link: 'https://www.challenge-roth.com' },
      { id: 4, title: 'Spiezathlon', category: 'Triathlon', date: '2026-06-20', location: 'Spiez', country: 'CH', lat: 46.6863, lng: 7.6791, distances: 'Olympic & Sprint', link: 'https://spiezathlon.ch' },
      { id: 5, title: 'Zürich Triathlon', category: 'Triathlon', date: '2026-06-27', location: 'Zürich', country: 'CH', lat: 47.3769, lng: 8.5417, distances: 'Standard & 5150', link: '#' },
      { id: 6, title: 'Velothon Challenge', category: 'Rennrad', date: '2026-06-22', location: 'Hamburg', country: 'DE', lat: 53.5511, lng: 9.9937, distances: '60 km, 100 km', link: '#' }
    ];

    let currentCategory = '';
    let map = null;
    let markers = [];

    function selectCategory(category) {
      currentCategory = category;
      document.getElementById('selectionView').style.display = 'none';
      document.getElementById('eventView').style.display = 'block';
      document.getElementById('subTitle').style.display = 'none';
      document.getElementById('currentCategoryTitle').innerText = category;

      if (!map) initMap();
      filterEvents();
    }

    function showSelection() {
      document.getElementById('selectionView').style.display = 'grid';
      document.getElementById('eventView').style.display = 'none';
      document.getElementById('subTitle').style.display = 'block';
    }

    function initMap() {
      map = L.map('map').setView([47.3769, 8.5417], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);
    }

    function filterEvents() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const country = document.getElementById('countryFilter').value;
      const month = document.getElementById('monthFilter').value;

      const filtered = events.filter(e => {
        const matchesCategory = e.category === currentCategory;
        const matchesSearch = e.title.toLowerCase().includes(search) || e.location.toLowerCase().includes(search);
        const matchesCountry = country === 'all' || e.country === country;
        const eventMonth = e.date ? e.date.split('-')[1] : '';
        const matchesMonth = month === 'all' || eventMonth === month;

        return matchesCategory && matchesSearch && matchesCountry && matchesMonth;
      });

      renderEvents(filtered);
    }

    function renderEvents(eventList) {
      const grid = document.getElementById('eventGrid');
      grid.innerHTML = '';

      markers.forEach(m => map.removeLayer(m));
      markers = [];

      if (eventList.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted)">Keine Events für diese Filterkriterien gefunden.</p>';
        return;
      }

      eventList.forEach(event => {
        const formattedDate = new Date(event.date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <span class="badge">${event.category}</span>
            <h3>${event.title}</h3>
            <p class="meta">📅 ${formattedDate}<br>📍 ${event.location} (${event.country || 'CH'})</p>
          </div>
          <div class="card-footer">
            <button class="btn-secondary" onclick="showDetails(${event.id})">Details</button>
            <button class="btn-action" onclick="zoomToEvent(${event.lat}, ${event.lng})">Karte</button>
          </div>
        `;
        grid.appendChild(card);

        if (event.lat && event.lng) {
          const marker = L.marker([event.lat, event.lng])
            .addTo(map)
            .bindPopup(`<b>${event.title}</b><br>${event.location}<br>${formattedDate}`);
          markers.push(marker);
        }
      });

      if (markers.length > 0) {
        const group = new L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.2));
      }
    }

    function zoomToEvent(lat, lng) {
      map.setView([lat, lng], 12);
      document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
    }

    /* MODAL HANDLING */
    function showDetails(id) {
      const event = events.find(e => e.id === id);
      if (!event) return;

      const formattedDate = new Date(event.date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

      document.getElementById('modalContent').innerHTML = `
        <span class="badge">${event.category}</span>
        <h2 style="margin: 0.5rem 0;">${event.title}</h2>
        <p style="color: var(--text-muted)">📍 ${event.location} | 📅 ${formattedDate}</p>
        <hr style="border-color: var(--border); margin: 1rem 0;">
        <p><strong>Distanzen / Disziplinen:</strong><br>${event.distances || 'Keine Angaben'}</p>
        ${event.link && event.link !== '#' ? `<a href="${event.link}" target="_blank" class="btn-action" style="display:inline-block; text-decoration:none; margin-top:1rem;">Zur Veranstalter-Website</a>` : ''}
      `;
      document.getElementById('detailModal').style.display = 'flex';
    }

    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function closeModalOnOverlay(e, id) { if (e.target.id === id) closeModal(id); }

    /* NEUES EVENT EINREICHEN & GEOCODING */
    async function submitNewEvent(e) {
      e.preventDefault();

      const title = document.getElementById('newTitle').value;
      const category = document.getElementById('newCategory').value;
      const date = document.getElementById('newDate').value;
      const locationInput = document.getElementById('newLocation').value;
      const distances = document.getElementById('newDistances').value;
      const link = document.getElementById('newLink').value;

      // Geocoding via Nominatim API
      let lat = 46.8182, lng = 8.2275; // Schweizer Standard-Fallback
      let country = 'CH';

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationInput)}`);
        const data = await response.json();
        if (data && data.length > 0) {
          lat = parseFloat(data[0].lat);
          lng = parseFloat(data[0].lon);
        }
      } catch (err) {
        console.warn('Geocoding fehlgeschlagen, verwende Fallback-Koordinaten');
      }

      const newEv = {
        id: Date.now(),
        title, category, date,
        location: locationInput,
        country: locationInput.toUpperCase().includes('DE') ? 'DE' : 'CH',
        lat, lng, distances, link
      };

      events.push(newEv);
      closeModal('addModal');
      document.getElementById('addEventForm').reset();
      
      selectCategory(category);
      alert('Event wurde erfolgreich hinzugefügt!');
    }
  </script>
</body>
</html>
