<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details – SWIM BIKE RUN</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1C1A17] text-[#E8E2D5] font-sans min-h-screen antialiased p-4 sm:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Zurück Button -->
    <a href="index.html" class="inline-flex items-center gap-2 text-[#E5A93C] hover:text-[#f0ba53] transition-colors font-bold text-xs uppercase tracking-widest">
      <svg class="w-4 h-4 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
      </svg>
      Zurück zur Übersicht
    </a>

    <!-- HEADER / HERO BEREICH -->
    <header class="space-y-3 border-b border-[#3D3730] pb-6">
      <div class="flex flex-wrap items-center gap-3">
        <h1 id="event-title" class="text-3xl sm:text-5xl font-black tracking-wider text-[#F0EAE1]">
          Loading Event...
        </h1>
      </div>
      
      <div class="flex flex-wrap items-center gap-4 text-xs sm:text-sm text-[#C2B7A3]">
        <!-- Datum Icon -->
        <span class="flex items-center gap-1.5">
          <svg class="w-4 h-4 text-[#E5A93C]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/>
          </svg>
          <strong id="event-date" class="text-[#E5A93C]">--.--.----</strong>
        </span>

        <!-- Ort Icon -->
        <span class="flex items-center gap-1.5">
          <svg class="w-4 h-4 text-[#C2B7A3]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
          </svg>
          <span id="event-location">--</span>
        </span>

        <!-- Kategorie Badge -->
        <span id="event-category-badge" class="bg-[#8B9A68]/20 border border-[#8B9A68]/40 text-[#B5C492] px-2.5 py-0.5 rounded-md text-xs font-bold uppercase tracking-wider">
          --
        </span>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="space-y-6">
      
      <!-- DISTANZEN KACHELN -->
      <div class="grid grid-cols-3 gap-3">
        <!-- Schwimmen -->
        <div class="bg-[#282420] border border-[#3D3730] p-4 rounded-xl flex flex-col items-center justify-center text-center">
          <svg class="w-6 h-6 stroke-[#8B9A68] mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 3.75h16.5m-16.5 3.75h16.5"/>
          </svg>
          <span class="text-[10px] uppercase font-bold text-[#A89F8D]">Schwimmen</span>
          <span id="dist-swim" class="text-sm sm:text-base font-bold text-[#E8E2D5] mt-1">--</span>
        </div>

        <!-- Radfahren -->
        <div class="bg-[#282420] border border-[#3D3730] p-4 rounded-xl flex flex-col items-center justify-center text-center">
          <svg class="w-6 h-6 stroke-[#E5A93C] mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <circle cx="5.5" cy="17.5" r="3.5" />
            <circle cx="18.5" cy="17.5" r="3.5" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 6h3m-3 0l-3.5 6.5M12 17.5l-3.5-7H15l2 7M5.5 17.5l4-7.5" />
          </svg>
          <span class="text-[10px] uppercase font-bold text-[#A89F8D]">Radfahren</span>
          <span id="dist-bike" class="text-sm sm:text-base font-bold text-[#E8E2D5] mt-1">--</span>
        </div>

        <!-- Laufen -->
        <div class="bg-[#282420] border border-[#3D3730] p-4 rounded-xl flex flex-col items-center justify-center text-center">
          <svg class="w-6 h-6 stroke-[#C86D51] mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.118a7.5 7.5 0 0114.998 0"/>
          </svg>
          <span class="text-[10px] uppercase font-bold text-[#A89F8D]">Laufen</span>
          <span id="dist-run" class="text-sm sm:text-base font-bold text-[#E8E2D5] mt-1">--</span>
        </div>
      </div>

      <!-- DETAILS & WOCHEN CARD -->
      <div class="bg-[#282420] border border-[#3D3730] rounded-xl p-5 sm:p-6 space-y-6">
        
        <div class="flex flex-wrap items-center justify-between border-b border-[#3D3730] pb-4 gap-4">
          <div>
            <h2 class="text-xs font-bold uppercase tracking-widest text-[#E5A93C]">Event Details</h2>
            <p class="text-xs text-[#A89F8D] uppercase mt-0.5">Über das Rennen</p>
          </div>

          <!-- WOCHEN ANZEIGE -->
          <div id="countdown-box" class="bg-[#1C1A17] border border-[#3D3730] px-4 py-2 rounded-lg flex items-center justify-center text-center">
            <div>
              <span id="cd-weeks" class="block font-black text-xl text-[#E5A93C]">--</span>
              <span id="cd-weeks-label" class="text-[9px] text-[#A89F8D] uppercase tracking-wider">Wochen</span>
            </div>
          </div>
        </div>

        <!-- BESCHREIBUNG -->
        <p id="event-description" class="text-sm sm:text-base leading-relaxed text-[#C2B7A3]">
          Beschreibung wird geladen...
        </p>

        <!-- EXTERNE LINKS BUTTONS -->
        <div class="flex flex-wrap gap-3 pt-2">
          <a id="btn-website" href="#" target="_blank" class="bg-[#E5A93C] hover:bg-[#f0ba53] text-[#1C1A17] font-bold text-xs uppercase px-5 py-2.5 rounded-lg transition-colors inline-flex items-center gap-2">
            <span>Offizielle Website</span>
            <svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H18m0 0v4.5m0-4.5L8.25 17.25"/>
            </svg>
          </a>
          <a id="btn-results" href="#" target="_blank" class="bg-[#211E1B] border border-[#3D3730] hover:border-[#E5A93C] text-[#E8E2D5] font-bold text-xs uppercase px-5 py-2.5 rounded-lg transition-colors inline-flex items-center gap-2">
            <span>Start- & Ranglisten</span>
            <svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H18m0 0v4.5m0-4.5L8.25 17.25"/>
            </svg>
          </a>
        </div>

      </div>

    </div>

  </div>

  <script src="event-details.js"></script>
</body>
</html>
